# Which patches exist and which one is current (docs/architecture.md 4.2).
#
# `current` is the single source of truth for "current patch": chunks never store a
# derived "is current" flag, they store a validity range. It must be one of the
# patches listed below, and no version may be repeated.
#
# `released_on` is part of the model, not a comment for humans: `PatchCatalog.current_at(day)`
# answers which patch was current on a given day, which is how a snapshot that carries no patch
# version (a poe2db page) is dated. Every patch needs one, and the dates must strictly increase with
# the versions.

current = "0.1.1"

[[patches]]
version = "0.1.0"
released_on = 2024-12-06

[[patches]]
version = "0.1.1"
released_on = 2025-01-17

[project]
name = "poe2-rag"
version = "0.1.0"
description = "Patch-aware RAG over Path of Exile 2 game data."
authors = [
    { name = "nico", email = "nico.09g@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

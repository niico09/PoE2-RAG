[project]
name = "poe2-rag"
version = "0.1.0"
description = "Patch-aware RAG over Path of Exile 2 game data."
authors = [
    { name = "nico", email = "nico.09g@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.3.0",
    "beautifulsoup4>=4.15.0",
    "chromadb>=1.5.9",
    "sentence-transformers>=6.2.0",
    "torch>=2.15.0",
    "httpx2>=2.16.0",
]

[project.scripts]
poe2-rag = "poe2_rag.cli:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "-m", "not integration and not live and not network"]
markers = [
    "integration: needs the real embedding or reranking model; opt in with '-m integration'",
    "live: exercises real model backends (the Claude API, which costs money and needs ANTHROPIC_API_KEY, or the local opencode CLI); opt in with '-m live'",
    "network: performs a real HTTP request to a remote host (poe2db.tw, www.pathofexile.com); opt in with '-m network' and a real POE2_RAG_HTTP_CONTACT",
]

[tool.ruff.lint.isort]
known-first-party = ["poe2_rag"]
